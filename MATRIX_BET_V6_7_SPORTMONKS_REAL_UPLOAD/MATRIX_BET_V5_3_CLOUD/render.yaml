services:
  - type: web
    name: matrix-bet
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: matrix-bet-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        value: https://matrix-bet.onrender.com

databases:
  - name: matrix-bet-db
    plan: free
    databaseName: matrixbet
