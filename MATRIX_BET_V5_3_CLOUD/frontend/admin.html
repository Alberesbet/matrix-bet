<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071712"><meta name="robots" content="noindex,nofollow"><title>MATRIX BET ADMIN</title><link rel="manifest" href="/static/admin-manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MATRIX BET ADMIN">
<style>
:root{--bg:#07100d;--p:#0e1815;--p2:#15221d;--line:#2a3b34;--g:#48e0ad;--y:#f0e23d;--txt:#f4f7f5;--mut:#91a19a;--red:#ff655b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}.top{min-height:64px;padding:8px 14px;display:flex;align-items:center;gap:10px;background:#08271f;border-bottom:1px solid #21463a;position:sticky;top:0;z-index:20}.logo{font-size:22px;font-weight:1000}.logo b{color:var(--y)}.dbpill{font-size:12px;border:1px solid #356351;border-radius:999px;padding:5px 9px;color:var(--g)}.spacer{flex:1}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:900;cursor:pointer}.primary{background:var(--y);color:#111}.ghost{background:#17231f;color:#fff;border:1px solid #35473f}.danger{background:#321817;color:#ffaaa5;border:1px solid #64322e}.login{max-width:410px;margin:60px auto;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--p)}.login input{width:100%;height:46px;margin:6px 0;border:1px solid var(--line);border-radius:7px;background:#070d0b;color:#fff;padding:0 11px}.wrap{max-width:1250px;margin:auto;padding:14px 14px 50px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:8px;background:var(--p);color:#fff;padding:10px 13px}.tabs button.on{color:var(--g);border-color:#4a826d}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.stat{padding:15px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(135deg,var(--p),#10251c)}.stat small{color:var(--mut)}.stat strong{display:block;color:var(--g);font-size:25px;margin-top:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar input,.toolbar select{background:#09110e;color:#fff;border:1px solid var(--line);border-radius:7px;padding:10px;min-width:170px}.panel{border:1px solid var(--line);border-radius:10px;background:var(--p);overflow:hidden;margin-top:12px}.head{padding:11px 13px;background:var(--p2);font-weight:900}.row{padding:11px 12px;border-top:1px solid #25352f;display:grid;grid-template-columns:1.25fr 1.35fr .8fr 1.1fr;gap:9px;align-items:center}.row small{color:var(--mut)}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.ticket,.activity{padding:13px;border-top:1px solid #25352f}.ticket textarea{width:100%;min-height:75px;background:#09110e;color:#fff;border:1px solid var(--line);border-radius:7px;padding:9px}.ticket select{background:#09110e;color:#fff;border:1px solid var(--line);border-radius:7px;padding:9px}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:15px}.card{width:min(720px,100%);max-height:88vh;overflow:auto;background:#0d1814;border:1px solid var(--line);border-radius:12px;padding:18px}.close{float:right;background:none;border:0;color:#fff;font-size:24px}.mini{font-size:12px;color:var(--mut)}.warn{color:#ffd45b}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.actions{justify-content:flex-start}.top{padding:8px 9px}.wrap{padding:10px}.dbpill{display:none}}

#installAdminApp{white-space:nowrap}
@media(max-width:700px){
  .top{flex-wrap:wrap}
  #installAdminApp{order:3;width:100%;padding:9px 11px}
}

</style></head><body>
<header class=top><div class=logo>MATRIX <b>BET ADMIN</b> <span style="font-size:11px;color:#91a19a">V5.9.5</span></div><span id=dbpill class=dbpill>Banco: verificando...</span><div class=spacer></div>
<button class="btn primary" id="installAdminApp">⬇ INSTALAR APP ADM</button>
<button class="btn danger hidden" id=logout>Sair</button></header>
<section id=login class=login>
  <h2>Área Administrativa</h2>
  <p style="color:var(--mut)">Acesso exclusivo do administrador MATRIX BET.</p>
  <p class="mini">Endereço fixo: <b>/admin</b></p>

  <div id="adminSetupBox" class="hidden">
    <h3>Primeiro cadastro do administrador</h3>
    <p class="mini">Crie sua conta administrativa. Depois desse primeiro cadastro, esta opção será desativada.</p>
    <input id="setupName" placeholder="Seu nome">
    <input id="setupEmail" type="email" autocomplete="email" placeholder="E-mail do administrador">
    <input id="setupPassword" type="password" autocomplete="new-password" placeholder="Senha (mín. 8 caracteres)">
    <button class="btn primary" style="width:100%;margin-top:8px" id="createAdmin">Cadastrar administrador</button>
    <p id="setupMsg" style="color:#f3dd61"></p>
    <hr style="border-color:#26362f;margin:18px 0">
  </div>

  <div id="adminLoginBox">
    <h3>Entrar</h3>
    <input id=email type=email autocomplete=username placeholder="E-mail administrativo">
    <input id=password type=password autocomplete=current-password placeholder="Senha">
    <button class="btn primary" style="width:100%;margin-top:8px" id=enter>Entrar</button>
    <p id=msg style="color:#f3dd61"></p>
  </div>
</section>
<section id=app class=hidden><div class=wrap><div class=tabs><button class=on data-tab=dashboard>Painel</button><button data-tab=users>Usuários</button><button data-tab=bets>Apostas</button><button data-tab=support>Suporte</button><button data-tab=activity>Atividade</button><button data-tab=adminaccount>Minha conta ADM</button></div><div id=content></div></div></section>
<div id=modal class="modal hidden"><div class=card><button id=closeModal class=close>×</button><div id=modalContent></div></div></div>
<script>
let token=localStorage.getItem('mx_admin_token')||'',tab='dashboard';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],money=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),dt=x=>{try{return new Date(x).toLocaleString('pt-BR')}catch{return x||''}};async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};
  if(token)opt.headers.Authorization='Bearer '+token;
  let r=await fetch(path,opt),j=await r.json().catch(()=>({}));
  if(!r.ok){
    let d=j.detail??j.message??'Erro';
    if(Array.isArray(d)) d=d.map(x=>x.msg||JSON.stringify(x)).join(' • ');
    else if(typeof d==='object') d=d.msg||JSON.stringify(d);
    throw new Error(String(d));
  }
  return j
}
async function checkAdminSetup(){
  try{
    let st=await api('/api/admin/setup-status');
    $('#adminSetupBox').classList.toggle('hidden', !st.setup_available);
    if(st.setup_available){
      $('#msg').textContent='Ainda não existe administrador. Faça o primeiro cadastro acima.';
    }
  }catch(e){
    $('#msg').textContent=e.message;
  }
}

async function createAdmin(){
  $('#setupMsg').textContent='';
  try{
    let j=await api('/api/admin/setup',{
      method:'POST',
      body:JSON.stringify({
        name:$('#setupName').value.trim(),
        email:$('#setupEmail').value.trim(),
        password:$('#setupPassword').value
      })
    });
    $('#setupMsg').textContent=j.message||'Administrador criado.';
    $('#email').value=$('#setupEmail').value.trim();
    $('#password').value='';
    $('#adminSetupBox').classList.add('hidden');
    $('#msg').textContent='Administrador cadastrado. Agora entre com seu e-mail e senha.';
  }catch(e){
    $('#setupMsg').textContent=e.message;
  }
}

async function login(){try{let j=await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});token=j.token;localStorage.setItem('mx_admin_token',token);showApp()}catch(e){$('#msg').textContent=e.message}}function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');render()}function toolbarUsers(){return `<div class=toolbar><input id=qUser placeholder="Buscar nome ou e-mail"><select id=blocked><option value=all>Todos</option><option value=no>Ativos</option><option value=yes>Bloqueados</option></select><button class="btn ghost" id=filterUsers>Buscar</button></div>`}function toolbarBets(){return `<div class=toolbar><input id=qBet placeholder="Buscar usuário/e-mail"><select id=betStatus><option value=all>Todos status</option><option value=OPEN>Abertas</option><option value=WON>Ganhas</option><option value=LOST>Perdidas</option></select><button class="btn ghost" id=filterBets>Buscar</button></div>`}
async function render(){try{if(tab==='dashboard'){let s=await api('/api/admin/stats');$('#dbpill').textContent='Banco: '+s.database+(s.persistent_database?' • persistente':' • local');$('#content').innerHTML=`<h2 style="margin:3px 0 12px">Painel do Administrador</h2><div class=stats><div class=stat><small>Usuários</small><strong>${s.users}</strong></div><div class=stat><small>Bloqueados</small><strong>${s.blocked_users}</strong></div><div class=stat><small>Apostas</small><strong>${s.bets}</strong></div><div class=stat><small>Apostas abertas</small><strong>${s.open_bets}</strong></div><div class=stat><small>Chamados</small><strong>${s.open_tickets}</strong></div><div class=stat><small>Volume demo</small><strong>${money(s.stake_total_cents)}</strong></div></div>${s.persistent_database?'':'<p class=warn>⚠ O serviço ainda está usando SQLite local. Conecte o PostgreSQL no Render para persistência.</p>'}`}if(tab==='users')await renderUsers();if(tab==='bets')await renderBets();if(tab==='support'){let j=await api('/api/admin/support');$('#content').innerHTML=`<div class=panel><div class=head>Suporte (${j.tickets.length})</div>${j.tickets.map(t=>`<div class=ticket><b>#${t.id} • ${t.username} • ${t.subject}</b><p>${t.message}</p><small>${t.email} • ${t.status} • ${dt(t.created_at)}</small><textarea id="r${t.id}" placeholder="Sua resposta">${t.admin_reply||''}</textarea><div style="display:flex;gap:8px;margin-top:6px"><select id="s${t.id}"><option value="OPEN" ${t.status==='OPEN'?'selected':''}>Aberto</option><option value="IN_PROGRESS" ${t.status==='IN_PROGRESS'?'selected':''}>Em atendimento</option><option value="RESOLVED" ${t.status==='RESOLVED'?'selected':''}>Resolvido</option></select><button class="btn primary" data-reply="${t.id}">Salvar resposta</button></div></div>`).join('')}</div>`;$$('[data-reply]').forEach(b=>b.onclick=async()=>{let id=b.dataset.reply;await api('/api/admin/support/'+id,{method:'PATCH',body:JSON.stringify({reply:$('#r'+id).value,status:$('#s'+id).value})});render()})}if(tab==='activity')await renderActivity();
if(tab==='adminaccount'){
  let st=await api('/api/admin/status');
  $('#content').innerHTML=`<div class=panel><div class=head>Minha conta administrativa</div>
  <div style="padding:18px">
    <p><b>Administrador:</b> ${st.admin.name}</p>
    <p><b>E-mail:</b> ${st.admin.email}</p>
    <p><b>Versão do painel:</b> ${st.version}</p>
    <p class=mini>Esta área não aparece no aplicativo dos clientes. O acesso é somente pelo endereço /admin.</p>
  </div></div>`;
}}catch(e){if(String(e.message).toLowerCase().includes('autentic')||String(e.message).toLowerCase().includes('sessão')){token='';localStorage.removeItem('mx_admin_token');location.reload()}else $('#content').innerHTML='<p>'+e.message+'</p>'}}
async function renderUsers(q='',blocked='all'){let j=await api('/api/admin/users?q='+encodeURIComponent(q)+'&blocked='+encodeURIComponent(blocked));$('#content').innerHTML=toolbarUsers()+`<div class=panel><div class=head>Usuários (${j.users.length})</div>${j.users.map(u=>`<div class=row><div><b>${u.name}</b><br><small>#${u.id} • ${u.cpf_masked}<br>${dt(u.created_at)}</small></div><div>${u.email}</div><div>${money(u.demo_balance_cents)}</div><div class=actions><button class="btn ghost" data-details="${u.id}">Detalhes</button><button class="btn ${u.is_blocked?'primary':'danger'}" data-block="${u.id}" data-state="${u.is_blocked?'0':'1'}">${u.is_blocked?'Desbloquear':'Bloquear'}</button></div></div>`).join('')}</div>`;$('#filterUsers').onclick=()=>renderUsers($('#qUser').value,$('#blocked').value);$$('[data-block]').forEach(b=>b.onclick=async()=>{await api('/api/admin/users/'+b.dataset.block,{method:'PATCH',body:JSON.stringify({is_blocked:b.dataset.state==='1'})});renderUsers($('#qUser').value,$('#blocked').value)});$$('[data-details]').forEach(b=>b.onclick=()=>userDetails(b.dataset.details))}
async function renderBets(q='',status='all'){let j=await api('/api/admin/bets?q='+encodeURIComponent(q)+'&status='+encodeURIComponent(status));$('#content').innerHTML=toolbarBets()+`<div class=panel><div class=head>Apostas (${j.bets.length})</div>${j.bets.map(b=>`<div class=row><div><b>#${b.id} • ${b.username}</b><br><small>${b.email}</small></div><div>${money(b.stake_cents)} • odd ${Number(b.total_odd).toFixed(2)}<br><small>retorno demo ${money(b.potential_return_cents)}</small></div><div>${b.status}</div><small>${dt(b.created_at)}</small></div>`).join('')}</div>`;$('#filterBets').onclick=()=>renderBets($('#qBet').value,$('#betStatus').value)}
async function renderActivity(q=''){let j=await api('/api/admin/activity?q='+encodeURIComponent(q));$('#content').innerHTML=`<div class=toolbar><input id=qAct placeholder="Buscar ação/detalhe"><button class="btn ghost" id=filterAct>Buscar</button></div><div class=panel><div class=head>Histórico (${j.activity.length})</div>${j.activity.map(a=>`<div class=activity><b>${a.action}</b> • ${a.username}<br><span>${a.details||'—'}</span><br><small>${dt(a.created_at)}</small></div>`).join('')}</div>`;$('#filterAct').onclick=()=>renderActivity($('#qAct').value)}
async function userDetails(id){let j=await api('/api/admin/users/'+id+'/details'),u=j.user;$('#modalContent').innerHTML=`<h2>${u.name}</h2><p>${u.email}<br>${u.cpf_masked}<br>Cadastro: ${dt(u.created_at)}</p><p><b>Saldo demo:</b> ${money(u.demo_balance_cents)}</p><div class=toolbar><input id=newBalance type=number min=0 step=1 value="${(u.demo_balance_cents/100).toFixed(2)}"><button class="btn primary" id=saveBalance>Alterar saldo DEMO</button></div><h3>Apostas recentes (${j.bets.length})</h3>${j.bets.slice(0,20).map(b=>`<p>#${b.id} • ${money(b.stake_cents)} • ${b.status} • ${dt(b.created_at)}</p>`).join('')||'<p>Nenhuma.</p>'}<h3>Chamados (${j.tickets.length})</h3>${j.tickets.slice(0,20).map(t=>`<p>#${t.id} • ${t.subject} • ${t.status}</p>`).join('')||'<p>Nenhum.</p>'}<h3>Atividade recente</h3>${j.activity.slice(0,30).map(a=>`<p><b>${a.action}</b><br><span class=mini>${a.details||''} • ${dt(a.created_at)}</span></p>`).join('')||'<p>Nenhuma.</p>'}`;$('#modal').classList.remove('hidden');$('#saveBalance').onclick=async()=>{let cents=Math.round(Number($('#newBalance').value||0)*100);await api('/api/admin/users/'+id+'/demo-balance',{method:'PATCH',body:JSON.stringify({demo_balance_cents:cents})});alert('Saldo demonstrativo atualizado.');userDetails(id)}}$('#enter').onclick=login;if($('#createAdmin')) $('#createAdmin').onclick=createAdmin;$('#logout').onclick=()=>{token='';localStorage.removeItem('mx_admin_token');location.reload()};$('#closeModal').onclick=()=>$('#modal').classList.add('hidden');$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));render()});
let adminInstallPrompt=null;

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  adminInstallPrompt=e;
  const b=$('#installAdminApp');
  if(b){
    b.disabled=false;
    b.textContent='⬇ INSTALAR APP ADM';
  }
});

window.addEventListener('appinstalled', ()=>{
  adminInstallPrompt=null;
  const b=$('#installAdminApp');
  if(b){
    b.textContent='✓ APP ADM INSTALADO';
    b.disabled=true;
  }
});

async function installAdminPwa(){
  const b=$('#installAdminApp');
  if(adminInstallPrompt){
    adminInstallPrompt.prompt();
    const choice=await adminInstallPrompt.userChoice;
    if(choice.outcome==='accepted'){
      b.textContent='✓ APP ADM INSTALADO';
      b.disabled=true;
    }
    adminInstallPrompt=null;
    return;
  }
  // Chrome/Android may not fire beforeinstallprompt if already installed
  // or if the browser controls installation directly.
  alert('Se a janela de instalação não aparecer, abra o menu ⋮ do navegador e toque em "Instalar app" ou "Adicionar à tela inicial".');
}

if($('#installAdminApp')) $('#installAdminApp').onclick=installAdminPwa;

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('/static/admin-service-worker.js', {scope:'/static/'})
      .catch(()=>{});
  });
}

if(token)showApp();else checkAdminSetup();
</script></body></html>
