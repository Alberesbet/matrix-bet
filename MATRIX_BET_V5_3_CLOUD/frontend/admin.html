<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071712"><title>MATRIX BET ADMIN</title>
<style>
:root{--bg:#07100d;--p:#0e1815;--p2:#15221d;--line:#2a3b34;--g:#48e0ad;--y:#f0e23d;--txt:#f4f7f5;--mut:#91a19a;--red:#ff655b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}.hidden{display:none!important}
.top{height:64px;padding:0 14px;display:flex;align-items:center;background:#08271f;border-bottom:1px solid #21463a;position:sticky;top:0;z-index:20}.logo{font-size:22px;font-weight:1000}.logo b{color:var(--y)}.spacer{flex:1}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:900}.primary{background:var(--y);color:#111}.ghost{background:#17231f;color:#fff;border:1px solid #35473f}.danger{background:#321817;color:#ffaaa5;border:1px solid #64322e}
.login{max-width:410px;margin:60px auto;padding:22px;border:1px solid var(--line);border-radius:14px;background:var(--p)}.login input{width:100%;height:46px;margin:6px 0;border:1px solid var(--line);border-radius:7px;background:#070d0b;color:#fff;padding:0 11px}
.wrap{max-width:1250px;margin:auto;padding:14px 14px 50px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:8px;background:var(--p);color:#fff;padding:10px 13px}.tabs button.on{color:var(--g);border-color:#4a826d}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:15px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(135deg,var(--p),#10251c)}.stat small{color:var(--mut)}.stat strong{display:block;color:var(--g);font-size:28px;margin-top:5px}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--p);overflow:hidden;margin-top:12px}.head{padding:11px 13px;background:var(--p2);font-weight:900}.row{padding:11px 12px;border-top:1px solid #25352f;display:grid;grid-template-columns:1.3fr 1.4fr .8fr .8fr;gap:9px;align-items:center}.row small{color:var(--mut)}.row button{justify-self:end}.ticket{padding:13px;border-top:1px solid #25352f}.ticket textarea{width:100%;min-height:75px;background:#09110e;color:#fff;border:1px solid var(--line);border-radius:7px;padding:9px}.ticket select{background:#09110e;color:#fff;border:1px solid var(--line);border-radius:7px;padding:9px}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.row button{justify-self:start}.top{padding:0 9px}.wrap{padding:10px}}
</style></head><body>
<header class=top><div class=logo>MATRIX <b>BET ADMIN</b></div><div class=spacer></div><button class="btn danger hidden" id=logout>Sair</button></header>
<section id=login class=login><h2>Área Administrativa</h2><p style="color:var(--mut)">Acesso exclusivo do administrador.</p><input id=email type=email placeholder="E-mail administrativo"><input id=password type=password placeholder="Senha"><button class="btn primary" style="width:100%;margin-top:8px" id=enter>Entrar</button><p id=msg style="color:#f3dd61"></p></section>
<section id=app class=hidden><div class=wrap>
<div class=tabs><button class=on data-tab=dashboard>Painel</button><button data-tab=users>Usuários</button><button data-tab=bets>Apostas</button><button data-tab=support>Suporte</button></div>
<div id=content></div></div></section>
<script>
let token=localStorage.getItem('mx_admin_token')||'',tab='dashboard';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],money=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;let r=await fetch(path,opt);let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Erro');return j}
async function login(){try{let j=await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});token=j.token;localStorage.setItem('mx_admin_token',token);showApp()}catch(e){$('#msg').textContent=e.message}}
function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');render()}
async function render(){try{
 if(tab==='dashboard'){let s=await api('/api/admin/stats');$('#content').innerHTML=`<div class=stats><div class=stat><small>Usuários</small><strong>${s.users}</strong></div><div class=stat><small>Bloqueados</small><strong>${s.blocked_users}</strong></div><div class=stat><small>Apostas</small><strong>${s.bets}</strong></div><div class=stat><small>Chamados abertos</small><strong>${s.open_tickets}</strong></div></div>`}
 if(tab==='users'){let j=await api('/api/admin/users');$('#content').innerHTML=`<div class=panel><div class=head>Usuários (${j.users.length})</div>${j.users.map(u=>`<div class=row><div><b>${u.name}</b><br><small>#${u.id} • ${u.cpf_masked}</small></div><div>${u.email}</div><div>${money(u.demo_balance_cents)}</div><button class="btn ${u.is_blocked?'primary':'danger'}" data-block="${u.id}" data-state="${u.is_blocked?'0':'1'}">${u.is_blocked?'Desbloquear':'Bloquear'}</button></div>`).join('')}</div>`;$$('[data-block]').forEach(b=>b.onclick=async()=>{await api('/api/admin/users/'+b.dataset.block,{method:'PATCH',body:JSON.stringify({is_blocked:b.dataset.state==='1'})});render()})}
 if(tab==='bets'){let j=await api('/api/admin/bets');$('#content').innerHTML=`<div class=panel><div class=head>Apostas (${j.bets.length})</div>${j.bets.map(b=>`<div class=row><div><b>#${b.id} • ${b.username}</b><br><small>${b.email}</small></div><div>${money(b.stake_cents)} • odd ${b.total_odd.toFixed(2)}</div><div>${b.status}</div><small>${new Date(b.created_at).toLocaleString('pt-BR')}</small></div>`).join('')}</div>`}
 if(tab==='support'){let j=await api('/api/admin/support');$('#content').innerHTML=`<div class=panel><div class=head>Suporte (${j.tickets.length})</div>${j.tickets.map(t=>`<div class=ticket><b>#${t.id} • ${t.username} • ${t.subject}</b><p>${t.message}</p><small>${t.email} • ${t.status}</small><textarea id="r${t.id}" placeholder="Sua resposta">${t.admin_reply||''}</textarea><div style="display:flex;gap:8px;margin-top:6px"><select id="s${t.id}"><option value="OPEN" ${t.status==='OPEN'?'selected':''}>Aberto</option><option value="IN_PROGRESS" ${t.status==='IN_PROGRESS'?'selected':''}>Em atendimento</option><option value="RESOLVED" ${t.status==='RESOLVED'?'selected':''}>Resolvido</option></select><button class="btn primary" data-reply="${t.id}">Salvar resposta</button></div></div>`).join('')}</div>`;$$('[data-reply]').forEach(b=>b.onclick=async()=>{let id=b.dataset.reply;await api('/api/admin/support/'+id,{method:'PATCH',body:JSON.stringify({reply:$('#r'+id).value,status:$('#s'+id).value})});render()})}
 }catch(e){if(String(e.message).includes('autentic')){token='';localStorage.removeItem('mx_admin_token');location.reload()}else $('#content').innerHTML='<p>'+e.message+'</p>'}}
$('#enter').onclick=login;$('#logout').onclick=()=>{token='';localStorage.removeItem('mx_admin_token');location.reload()};$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));render()});if(token)showApp();
</script></body></html>
