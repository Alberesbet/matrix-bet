<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1117">
<title>MATRIX - FUTEBOL</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1117;color:#eef5f1;font-family:Arial,sans-serif}
.wrap{max-width:1050px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
h1{margin:0 0 4px;font-size:26px}.sub{color:#8ea59a;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.card{background:#121b22;border:1px solid #24333c;border-radius:15px;padding:13px}.big{font-size:24px;font-weight:700;color:#46e6a2}
.label{font-size:10px;color:#8ea59a;text-transform:uppercase}.tabs{display:flex;gap:6px;overflow:auto;margin-top:12px;padding-bottom:2px}
.tab{white-space:nowrap;border:1px solid #2b3e48;background:#101820;color:#b8c6c0;padding:10px 13px;border-radius:9px;font-weight:800}.tab.on{background:#173127;color:#5ef0b1;border-color:#2d7755}
.item{margin-top:10px;padding:13px;border-radius:13px;background:#111921;border:1px solid #253842}.row{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#173127;color:#5ef0b1;font-size:10px;font-weight:700}
.wait{background:#352c16;color:#ffd96c}.bad{background:#3b1e1e;color:#ffaaaa}.live{background:#3b1d29;color:#ff9fbd}.muted{color:#8ea59a;font-size:12px}
.btn{border:0;border-radius:10px;padding:11px 14px;background:#25c77f;color:#07120d;font-weight:900}.reason{margin-top:8px;padding-top:8px;border-top:1px solid #253842;font-size:12px;color:#c5d1cc}
.err{color:#ff8f8f;margin-top:10px}.score{font-size:22px;font-weight:900;margin:7px 0;color:#fff}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}h1{font-size:22px}.row{font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>MATRIX - FUTEBOL</h1><div class="sub">V3.2 • Libertadores • Internacional • AO VIVO • SportMonks</div></div>
    <button id="go" class="btn">ANALISAR AGORA</button>
  </div>

  <div class="grid">
    <div class="card"><div class="label">Status</div><div id="status" class="big">...</div></div>
    <div class="card"><div class="label">Jogos próximos 7 dias</div><div id="jogos" class="big">0</div></div>
    <div class="card"><div class="label">Libertadores</div><div id="lib" class="big">0</div></div>
    <div class="card"><div class="label">Ao vivo</div><div id="live" class="big">0</div></div>
    <div class="card"><div class="label">Internacionais</div><div id="intl" class="big">0</div></div>
    <div class="card"><div class="label">Com odds</div><div id="odds" class="big">0</div></div>
    <div class="card"><div class="label">Sinais</div><div id="signals" class="big">0</div></div>
    <div class="card"><div class="label">Atualização</div><div id="time" style="font-size:12px;margin-top:7px">...</div></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-mode="sinais">SINAIS</button>
    <button class="tab" data-mode="live">🔴 AO VIVO</button>
    <button class="tab" data-mode="lib">LIBERTADORES</button>
    <button class="tab" data-mode="intl">INTERNACIONAIS</button>
    <button class="tab" data-mode="todos">TODOS</button>
  </div>

  <div class="card" style="margin-top:9px">
    <strong id="title">Sinais encontrados</strong>
    <div id="list"></div>
    <div id="error" class="err"></div>
  </div>
</div>

<script>
let state=null, mode='sinais';
const $=id=>document.getElementById(id);

function statusBadge(s, live){
  if(live) return '<span class="badge live">AO VIVO</span>';
  if(s==='APROVADO') return '<span class="badge">APROVADO</span>';
  if(s==='AGUARDAR') return '<span class="badge wait">AGUARDAR</span>';
  return `<span class="badge bad">${s||'SEM DADO'}</span>`;
}

function currentList(){
  if(!state) return [];
  if(mode==='live') return state.ao_vivo||[];
  if(mode==='lib') return state.libertadores||[];
  if(mode==='intl') return state.internacionais||[];
  if(mode==='todos') return state.todos||[];
  return state.sinais||[];
}
function title(){
  return {sinais:'Sinais encontrados',live:'Jogos AO VIVO',lib:'Copa Libertadores',intl:'Competições internacionais',todos:'Todos os jogos'}[mode];
}

function render(){
  $('title').textContent=title();
  const data=currentList();
  $('list').innerHTML='';
  if(!data.length){
    let msg='Nenhum jogo nesta categoria no período consultado.';
    if(mode==='live') msg='Nenhuma partida ao vivo disponível agora para as ligas do seu plano SportMonks.';
    if(mode==='lib') msg='Nenhum jogo da Libertadores encontrado nos próximos 7 dias dentro das ligas liberadas no seu plano.';
    $('list').innerHTML=`<p class="muted">${msg}</p>`;
    return;
  }
  data.forEach(x=>{
    const div=document.createElement('div'); div.className='item';
    div.innerHTML=`
      <div class="row"><strong>${x.jogo||'-'}</strong>${statusBadge(x.status,x.ao_vivo)}</div>
      <div class="muted">${x.liga||''} • ${x.horario||''}${x.estado?' • '+x.estado:''}</div>
      ${x.ao_vivo?`<div class="score">${x.placar||'-'}</div>`:''}
      ${x.selecao?`
        <div class="row"><span>Mercado</span><b>${x.mercado}</b></div>
        <div class="row"><span>Entrada sugerida</span><b>${x.selecao}</b></div>
        <div class="row"><span>Odd</span><b>${x.odd}</b></div>
        <div class="row"><span>Probabilidade implícita</span><b>${x.prob}%</b></div>`:''}
      <div class="reason"><b>Motivo:</b> ${x.motivo||'—'}</div>`;
    $('list').appendChild(div);
  });
}

async function refresh(){
  try{
    const r=await fetch('/api/status',{cache:'no-store'});
    state=await r.json();
    $('status').textContent=state.status||'-';
    $('jogos').textContent=state.jogos_encontrados||0;
    $('lib').textContent=(state.libertadores||[]).length;
    $('live').textContent=(state.ao_vivo||[]).length;
    $('intl').textContent=(state.internacionais||[]).length;
    $('odds').textContent=state.jogos_com_odds||0;
    $('signals').textContent=(state.sinais||[]).length;
    $('time').textContent=state.ultima_atualizacao||'-';
    $('error').textContent=state.erro?('Erro: '+state.erro):'';
    render();
  }catch(e){$('error').textContent='Falha ao atualizar o painel.'}
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  render();
});

$('go').onclick=async()=>{
  const b=$('go'); b.disabled=true; b.textContent='ANALISANDO...';
  try{await fetch('/api/analisar',{method:'POST',cache:'no-store'}); await refresh();}
  finally{b.disabled=false;b.textContent='ANALISAR AGORA'}
};

refresh();
setInterval(refresh,15000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js').catch(()=>{});}
</script>
</body>
</html>
