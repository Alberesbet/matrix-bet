<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1117">
<title>MATRIX - FUTEBOL</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;background:#091017;color:#edf5f1;font-family:Arial,sans-serif}
.wrap{max-width:1080px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
h1{margin:0 0 4px;font-size:27px}.sub{color:#87a097;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.card{background:#111a21;border:1px solid #243640;border-radius:15px;padding:13px}.big{font-size:24px;font-weight:800;color:#49e7a4}
.label{font-size:10px;color:#879c94;text-transform:uppercase}.tabs{display:flex;gap:6px;overflow:auto;margin-top:12px;padding-bottom:3px}
.tab{white-space:nowrap;border:1px solid #2b3e48;background:#0f171e;color:#b7c6c0;padding:10px 13px;border-radius:9px;font-weight:800}.tab.on{background:#173127;color:#5ef0b1;border-color:#347b5b}
.item{margin-top:10px;padding:14px;border-radius:13px;background:#101820;border:1px solid #253942}.row{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#173127;color:#5ef0b1;font-size:10px;font-weight:800}.wait{background:#352c16;color:#ffd96c}.bad{background:#3b1e1e;color:#ffaaaa}.live{background:#4b1d2c;color:#ff9fbd}.muted{color:#8ca098;font-size:12px}
.btn{border:0;border-radius:10px;padding:11px 14px;background:#25c77f;color:#07120d;font-weight:900;cursor:pointer}.btn2{border:1px solid #347b5b;border-radius:9px;padding:9px 11px;background:#142920;color:#68efb7;font-weight:900;cursor:pointer}
.reason,.h2h{margin-top:9px;padding-top:9px;border-top:1px solid #253942;font-size:12px;color:#c5d1cc}.score{font-size:25px;font-weight:900;margin:7px 0}.clock{font-size:17px;font-weight:900;color:#ff9fbd}
.betbox{margin-top:10px;padding:10px;background:#0b1319;border:1px solid #22343d;border-radius:10px}.betinput{width:100px;padding:8px;border-radius:8px;border:1px solid #36505b;background:#071015;color:#fff}
.smallgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.mini{background:#0b1319;border-radius:9px;padding:8px;text-align:center}.mini b{display:block;margin-top:3px}
.hist{margin-top:6px;padding:6px 0;border-top:1px dashed #263b44}.err{color:#ff9090;margin-top:10px}.money{color:#62efb5;font-weight:900}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}h1{font-size:22px}.row{font-size:13px}.smallgrid{grid-template-columns:1fr 1fr}.item{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>MATRIX - FUTEBOL</h1>
      <div class="sub">V3.8 • Teste MarketId direto • Betfair Mirror • Bf Bot Manager</div>
    </div>
    <button id="go" class="btn">ANALISAR AGORA</button>
  </div>

  <div class="grid">
    <div class="card"><div class="label">Status</div><div id="status" class="big">...</div></div>
    <div class="card"><div class="label">Jogos próximos 30 dias</div><div id="jogos" class="big">0</div></div>
    <div class="card"><div class="label">Libertadores</div><div id="lib" class="big">0</div></div>
    <div class="card"><div class="label">Ao vivo</div><div id="live" class="big">0</div></div>
    <div class="card"><div class="label">Internacionais</div><div id="intl" class="big">0</div></div>
    <div class="card"><div class="label">Com odds</div><div id="odds" class="big">0</div></div>
    <div class="card"><div class="label">Sinais aprovados</div><div id="signals" class="big">0</div></div>
    <div class="card"><div class="label">Minhas apostas</div><div id="bets" class="big">0</div></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-mode="sinais">SINAIS</button>
    <button class="tab" data-mode="live">🔴 AO VIVO</button>
    <button class="tab" data-mode="lib">LIBERTADORES</button>
    <button class="tab" data-mode="intl">INTERNACIONAIS</button>
    <button class="tab" data-mode="todos">TODOS</button>
    <button class="tab" data-mode="bets">MINHAS APOSTAS</button>
    <button class="tab" data-mode="account">CONTA</button>
    <button class="tab" data-mode="bfbot">BFBOT</button>
    <button class="tab" data-mode="betfair">BETFAIR</button>
  </div>

  <div class="card" style="margin-top:9px">
    <strong id="title">Sinais encontrados</strong>
    <div id="list"></div>
    <div id="error" class="err"></div>
  </div>
</div>

<script>
let state=null, mode='sinais';
const $=id=>document.getElementById(id);
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getBets(){try{return JSON.parse(localStorage.getItem('matrix_bets_v33')||'[]')}catch(e){return[]}}
function saveBets(v){localStorage.setItem('matrix_bets_v33',JSON.stringify(v));$('bets').textContent=v.length}

function badge(x){
  if(x.ao_vivo)return '<span class="badge live">AO VIVO</span>';
  if(x.status==='APROVADO')return '<span class="badge">APROVADO</span>';
  if(x.status==='AGUARDAR')return '<span class="badge wait">AGUARDAR</span>';
  return `<span class="badge bad">${esc(x.status||'SEM DADO')}</span>`;
}

function listForMode(){
  if(mode==='account'||mode==='bfbot'||mode==='betfair')return [];
  if(mode==='bets')return getBets();
  if(!state)return[];
  if(mode==='live')return state.ao_vivo||[];
  if(mode==='lib')return state.libertadores||[];
  if(mode==='intl')return state.internacionais||[];
  if(mode==='todos')return state.todos||[];
  return state.sinais||[];
}
function titleForMode(){
  return {sinais:'Sinais encontrados',live:'Jogos AO VIVO',lib:'Copa Libertadores',intl:'Jogos internacionais',todos:'Todos os jogos analisados',bets:'Minhas apostas de SIMULAÇÃO',account:'Informações da conta',bfbot:'Integração Bf Bot Manager',betfair:'Mercados Betfair / BF Bot Manager'}[mode];
}

function h2hHtml(x){
  const h=x.h2h||{};
  if(!h.disponivel){
    return `<div class="h2h"><b>Histórico da dupla (H2H):</b> ${esc(h.motivo||'Sem histórico disponível.')}</div>`;
  }
  const games=(h.ultimos||[]).map(g=>`<div class="hist">${esc(g.data)} • ${esc(g.jogo)} • <b>${esc(g.placar)}</b></div>`).join('');
  return `<div class="h2h">
    <b>Últimos ${h.jogos} confrontos da dupla</b>
    <div class="smallgrid">
      <div class="mini">Vitórias ${esc(x.casa)}<b>${h.vitorias_time1}</b></div>
      <div class="mini">Empates<b>${h.empates}</b></div>
      <div class="mini">Vitórias ${esc(x.fora)}<b>${h.vitorias_time2}</b></div>
      <div class="mini">Média de gols<b>${h.media_gols}</b></div>
      <div class="mini">+1,5 gols<b>${h.over15_pct}%</b></div>
      <div class="mini">Ambas marcam<b>${h.ambas_marcam_pct}%</b></div>
    </div>
    <div style="margin-top:7px">Tendência H2H: <b>${esc(h.tendencia)}</b></div>
    ${games}
  </div>`;
}

function betBox(x, idx){
  if(!x.selecao||!x.odd)return'';
  const def=Number(x.stake_padrao||10).toFixed(2);
  return `<div class="betbox">
    <div><b>Simular aposta</b></div>
    <div class="row"><span>Valor</span><input id="stake_${idx}" class="betinput" type="number" min="1" step="1" value="${def}"></div>
    <div class="row"><span>Retorno potencial</span><b id="ret_${idx}" class="money">${money(def*x.odd)}</b></div>
    <div class="row"><span>Lucro potencial</span><b id="profit_${idx}" class="money">${money(def*x.odd-def)}</b></div>
    <button class="btn2" style="margin-top:9px" onclick="placeBet(${idx})">APOSTAR EM SIMULAÇÃO</button>
  </div>`;
}

let rendered=[];
function renderGame(x, idx){
  return `<div class="item">
    <div class="row"><strong>${esc(x.jogo||'-')}</strong>${badge(x)}</div>
    <div class="muted">${esc(x.liga||'')} • ${esc(x.pais||'')} • ${esc(x.horario||'')}</div>
    ${x.ao_vivo?`<div class="row"><div class="score">${esc(x.placar||'-')}</div><div class="clock">${esc(x.tempo_jogo||'-')}${x.tempo_aproximado?' aprox.':''}</div></div><div class="muted">Estado: ${esc(x.estado||'AO VIVO')}</div>`:`<div class="muted">Começa ${esc(x.comeca_em||'-')}</div>`}
    ${x.selecao?`
      <div class="row"><span>Mercado</span><b>${esc(x.mercado)}</b></div>
      <div class="row"><span>Melhor possibilidade</span><b>${esc(x.selecao)}</b></div>
      <div class="row"><span>Odd mediana</span><b>${x.odd}</b></div>
      <div class="row"><span>Melhor odd recebida</span><b>${x.melhor_odd}</b></div>
      <div class="row"><span>Prob. implícita das odds</span><b>${x.prob_mercado}%</b></div>
      <div class="row"><span>Índice combinado odds + H2H</span><b>${x.indice_combinado}%</b></div>
      <div class="muted">Peso do histórico direto: ${x.peso_h2h}%</div>
    `:''}
    ${h2hHtml(x)}
    <div class="reason"><b>Motivo:</b> ${esc(x.motivo||'—')}</div>
    ${betBox(x,idx)}
  </div>`;
}

function renderBet(b){
  return `<div class="item">
    <div class="row"><strong>${esc(b.jogo)}</strong><span class="badge">SIMULAÇÃO</span></div>
    <div class="muted">${esc(b.liga||'')} • ${esc(b.horario||'')}</div>
    <div class="row"><span>Apostado em</span><b>${esc(b.selecao)}</b></div>
    <div class="row"><span>Mercado</span><b>${esc(b.mercado)}</b></div>
    <div class="row"><span>Valor apostado</span><b>${money(b.stake)}</b></div>
    <div class="row"><span>Odd registrada</span><b>${b.odd}</b></div>
    <div class="row"><span>Retorno potencial</span><b class="money">${money(b.retorno)}</b></div>
    <div class="row"><span>Lucro potencial</span><b class="money">${money(b.lucro)}</b></div>
    <div class="row"><span>Status</span><b>${esc(b.status||'AGUARDANDO RESULTADO')}</b></div>
    <div class="muted" style="margin-top:8px">Registrada em ${esc(b.criada_em)}</div>
  </div>`;
}


function fmtMoney(v,currency='BRL'){
  if(v===null||v===undefined||v==='')return '—';
  try{return Number(v).toLocaleString('pt-BR',{style:'currency',currency:currency||'BRL'});}
  catch(e){return String(v);}
}

function renderAccount(){
  const a=(state&&state.conta)||{};
  const connected=!!a.conectada;
  $('list').innerHTML=`
    <div class="item">
      <div class="row"><strong>Conta da casa de apostas</strong>
        <span class="badge ${connected?'':'wait'}">${esc(a.status||'AGUARDANDO API')}</span>
      </div>
      <div class="row"><span>Casa de apostas</span><b>${esc(a.casa||'-')}</b></div>
      <div class="row"><span>Usuário</span><b>${esc(a.usuario||'-')}</b></div>
      <div class="row"><span>ID da conta</span><b>${esc(a.id_conta||'-')}</b></div>
      <div class="row"><span>Modo</span><b>${esc(a.modo||'SIMULACAO')}</b></div>
      <div class="row"><span>Moeda</span><b>${esc(a.moeda||'BRL')}</b></div>
      <div class="row"><span>Saldo</span><b class="money">${fmtMoney(a.saldo,a.moeda)}</b></div>
      <div class="row"><span>Saldo disponível</span><b class="money">${fmtMoney(a.saldo_disponivel,a.moeda)}</b></div>
      <div class="row"><span>Apostas abertas</span><b>${a.apostas_abertas??0}</b></div>
      <div class="reason">${esc(a.observacao||'')}</div>
      <div class="muted" style="margin-top:8px">
        Senha, token e chave da API nunca aparecem nesta tela.
      </div>
    </div>`;
}


function renderBfBot(){
  const b=(state&&state.bfbot)||{};
  const feed=location.origin+(b.feed_path||'/bfbot/tips.csv');
  $('list').innerHTML=`
    <div class="item">
      <div class="row"><strong>Bf Bot Manager</strong>
        <span class="badge ${b.habilitado?'':'wait'}">${b.habilitado?'FEED ATIVO':'DESATIVADO'}</span>
      </div>
      <div class="row"><span>Tips prontas</span><b>${b.tips_prontas??0}</b></div>
      <div class="row"><span>Provider</span><b>${esc(b.provider||'MATRIX')}</b></div>
      <div class="row"><span>Mercado</span><b>${esc(b.market_type||'MATCH_ODDS')}</b></div>
      <div class="row"><span>Tipo</span><b>${esc(b.bet_type||'BACK')}</b></div>
      <div class="row"><span>Tip permanece no feed até</span><b>INÍCIO DO JOGO</b></div>
      <div class="row"><span>SportMonks Fixture ID</span><b>${b.sportmonks_fixture_id?'ATIVO':'—'}</b></div>
      <div class="row"><span>PIB/BSP</span><b>${b.bsp===false?'DESLIGADO':'—'}</b></div>
      <div class="reason">
        <b>URL do arquivo de tips:</b><br>
        <span style="word-break:break-all">${esc(feed)}</span>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn2" href="${esc(b.feed_path||'/bfbot/tips.csv')}" target="_blank">ABRIR CSV</a>
        <a class="btn2" href="${esc(b.test_marketid_path||'/bfbot/test_marketid.csv')}" target="_blank">TESTE MARKET ID</a>
      </div>
      <div class="reason" style="margin-top:10px">
        <b>Teste isolado:</b> Sabah FA v Imigresen FC • MarketId 1.261459879 • Seleção Sabah FA.
        Provider: MATRIX_TESTE_NAO_APOSTAR. Importe apenas para confirmar se o Market ID deixa de ficar 0.
      </div>
      <div class="muted" style="margin-top:10px">
        O feed envia somente sinais pré-jogo APROVADOS. O Bf Bot Manager é quem conecta à conta Betfair e executa a estratégia configurada.
      </div>
    </div>`;
}


function bfStartLabel(raw){
  if(!raw)return 'Horário não informado';
  let d=null;
  // formatos comuns do export: ISO, YYYY-MM-DD HH:mm:ss ou DD-MM HH:mm
  const s=String(raw).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) d=new Date(s.replace(' ','T')+(s.includes('Z')?'':'Z'));
  if(!d || isNaN(d)){
    const m=s.match(/^(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/);
    if(m){
      const now=new Date();
      d=new Date(now.getFullYear(),Number(m[2])-1,Number(m[1]),Number(m[3]),Number(m[4]));
    }
  }
  if(!d || isNaN(d))return s;
  const mins=Math.round((d.getTime()-Date.now())/60000);
  if(mins>60)return `Começa em ${Math.floor(mins/60)}h ${mins%60}min`;
  if(mins>0)return `Começa em ${mins} min`;
  return 'Horário de início já passou / possível AO VIVO';
}

function renderBetfairMarket(x){
  const linked=x.linkado_matrix;
  const live=x.matrix_live||x.in_play;
  return `<div class="item">
    <div class="row">
      <strong>${esc(x.event_name||'-')}</strong>
      <span class="badge ${live?'live':(linked?'':'wait')}">${live?'AO VIVO / ABERTO':(linked?'LINKADO':'BETFAIR')}</span>
    </div>
    <div class="muted">${esc(x.market_name||'Mercado Betfair')} • ${esc(x.status||'IMPORTADO')}</div>
    <div class="row"><span>Hora de início</span><b>${esc(x.start_time||'—')}</b></div>
    <div class="muted">${esc(bfStartLabel(x.start_time))}</div>
    <div class="row"><span>Market ID</span><b>${esc(x.market_id||'—')}</b></div>
    <div class="row"><span>Event ID</span><b>${esc(x.event_id||'—')}</b></div>
    ${x.total_matched?`<div class="row"><span>Total correspondido</span><b>${esc(x.total_matched)}</b></div>`:''}
    ${linked?`
      <div class="reason"><b>MATRIX encontrou o mesmo jogo na SportMonks.</b></div>
      ${x.matrix_live?`<div class="row"><span>Placar</span><b>${esc(x.placar||'-')}</b></div>
      <div class="row"><span>Tempo</span><b>${esc(x.tempo_jogo||'-')}</b></div>`:''}
      ${x.selecao?`<div class="row"><span>Melhor possibilidade MATRIX</span><b>${esc(x.selecao)}</b></div>
      <div class="row"><span>Odd</span><b>${esc(x.odd||'-')}</b></div>
      <div class="row"><span>Índice</span><b>${esc(x.indice_combinado||'-')}%</b></div>`:''}
    `:`<div class="reason"><b>Mercado Betfair visível.</b> Ainda sem correspondência nos dados SportMonks do MATRIX.</div>`}
  </div>`;
}

function renderBetfair(){
  const b=(state&&state.betfair_mirror)||{};
  const markets=b.markets||[];
  $('list').innerHTML=`
    <div class="item">
      <div class="row"><strong>Espelho dos mercados do BF Bot Manager</strong>
        <span class="badge">${markets.length} MERCADOS</span></div>
      <div class="smallgrid">
        <div class="mini">Importados<b>${b.total||0}</b></div>
        <div class="mini">Match Odds<b>${b.match_odds||0}</b></div>
        <div class="mini">Linkados SportMonks<b>${b.linkados_sportmonks||0}</b></div>
        <div class="mini">Ao vivo identificados<b>${b.ao_vivo_identificados||0}</b></div>
      </div>
      <div class="reason">
        O MATRIX mostra aqui o último CSV exportado do BF Bot Manager. 
        O BF Bot Manager não oferece uma auto-exportação pública de mercados.
      </div>
      <input id="bfMarketFile" type="file" accept=".csv,text/csv" style="display:none">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="btn2" onclick="document.getElementById('bfMarketFile').click()">IMPORTAR MERCADOS BFBOT</button>
        <a class="btn2" href="https://livevideo.betfair.bet.br/" target="_blank" rel="noopener">📺 BETFAIR TV OFICIAL</a>
        <a class="btn2" href="https://www.betfair.bet.br/exchange/plus/inplay/all?filter-by=live-video" target="_blank" rel="noopener">🔴 EXCHANGE AO VIVO</a>
      </div>
      <div class="muted" style="margin-top:8px">Arquivo: ${esc(b.filename||'nenhum')} • atualização: ${esc(b.updated_at||'—')}</div>
    </div>
    ${markets.length ? markets.map(renderBetfairMarket).join('') :
      '<div class="item"><b>Nenhum mercado Betfair importado ainda.</b><div class="muted">No BF Bot Manager use EVENTOS E MERCADOS → Export markets (ou Export all visible data) e importe o CSV aqui.</div></div>'}
  `;
  const input=$('bfMarketFile');
  if(input){
    input.onchange=async e=>{
      const file=e.target.files&&e.target.files[0];
      if(!file)return;
      const text=await file.text();
      localStorage.setItem('matrix_betfair_markets_csv',text);
      localStorage.setItem('matrix_betfair_markets_name',file.name);
      const r=await fetch('/api/betfair/markets/import',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({csv:text,filename:file.name})
      });
      const j=await r.json();
      if(!j.ok){alert('Falha ao importar: '+(j.erro||'erro'));return;}
      await refresh();
      mode='betfair';
      document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.mode==='betfair'));
      render();
    };
  }
}

let bfRestoreTried=false;
async function restoreBetfairCsv(){
  if(bfRestoreTried)return;
  bfRestoreTried=true;
  const text=localStorage.getItem('matrix_betfair_markets_csv');
  if(!text)return;
  if(state&&state.betfair_mirror&&state.betfair_mirror.total)return;
  try{
    await fetch('/api/betfair/markets/import',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        csv:text,
        filename:localStorage.getItem('matrix_betfair_markets_name')||'markets.csv'
      })
    });
  }catch(e){}
}

function render(){
  $('title').textContent=titleForMode();
  if(mode==='account'){renderAccount();return;}
  if(mode==='bfbot'){renderBfBot();return;}
  if(mode==='betfair'){renderBetfair();return;}
  const data=listForMode();
  $('list').innerHTML='';
  rendered=data;

  if(!data.length){
    let msg='Nenhum item nesta categoria.';
    if(mode==='live')msg='Nenhum jogo ao vivo retornado pela SportMonks agora.';
    if(mode==='lib')msg='Nenhum jogo da Libertadores retornado nos próximos 30 dias. Se houver rodada nesse período, confira se a liga está liberada no seu plano SportMonks.';
    if(mode==='bets')msg='Você ainda não registrou nenhuma aposta de simulação.';
    $('list').innerHTML=`<p class="muted">${msg}</p>`;
    return;
  }

  if(mode==='bets'){
    $('list').innerHTML=data.map(renderBet).join('');
    return;
  }

  $('list').innerHTML=data.map((x,i)=>renderGame(x,i)).join('');

  data.forEach((x,i)=>{
    const inp=$(`stake_${i}`);
    if(!inp||!x.odd)return;
    inp.addEventListener('input',()=>{
      const stake=Math.max(0,Number(inp.value||0));
      $(`ret_${i}`).textContent=money(stake*x.odd);
      $(`profit_${i}`).textContent=money(stake*x.odd-stake);
    });
  });
}

window.placeBet=function(idx){
  const x=rendered[idx];
  if(!x||!x.odd)return;
  const inp=$(`stake_${idx}`);
  const stake=Math.max(1,Number(inp?.value||x.stake_padrao||10));
  const retorno=Number((stake*x.odd).toFixed(2));
  const lucro=Number((retorno-stake).toFixed(2));
  const bets=getBets();
  bets.unshift({
    id:Date.now(),
    fixture_id:x.fixture_id,
    jogo:x.jogo,
    liga:x.liga,
    horario:x.horario,
    mercado:x.mercado,
    selecao:x.selecao,
    stake:Number(stake.toFixed(2)),
    odd:x.odd,
    retorno,
    lucro,
    status:'AGUARDANDO RESULTADO',
    criada_em:new Date().toLocaleString('pt-BR')
  });
  saveBets(bets);
  alert(`Simulação registrada: ${x.selecao} • ${money(stake)} • retorno potencial ${money(retorno)}`);
};

async function refresh(){
  try{
    const r=await fetch('/api/status',{cache:'no-store'});
    state=await r.json();
    $('status').textContent=state.status||'-';
    $('jogos').textContent=state.jogos_encontrados||0;
    $('lib').textContent=(state.libertadores||[]).length;
    $('live').textContent=(state.ao_vivo||[]).length;
    $('intl').textContent=(state.internacionais||[]).length;
    $('odds').textContent=state.jogos_com_odds||0;
    $('signals').textContent=(state.sinais||[]).length;
    $('bets').textContent=getBets().length;
    $('error').textContent=state.erro?('Erro: '+state.erro):'';
    await restoreBetfairCsv();
    render();
  }catch(e){
    $('status').textContent='ERRO'; $('error').textContent='Falha ao consultar /api/status. Aguarde alguns segundos e tente ANALISAR AGORA.';
  }
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  render();
});

$('go').onclick=async()=>{
  const b=$('go');
  b.disabled=true;
  b.textContent='ANALISANDO...';
  try{
    await fetch('/api/analisar',{method:'POST',cache:'no-store'});
    await refresh();
  }finally{
    b.disabled=false;
    b.textContent='ANALISAR AGORA';
  }
};

$('bets').textContent=getBets().length;
refresh();
setInterval(refresh,15000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js').catch(()=>{});}
</script>
</body>
